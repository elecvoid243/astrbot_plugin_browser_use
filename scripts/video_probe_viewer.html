<!doctype html><meta charset="utf-8"><title>WebRTC feasibility viewer</title>
<style>body{margin:0;background:#0f172a;color:white;font:14px system-ui}#surface{position:relative;width:100vw;height:calc(100vh - 30px)}video,img{width:100%;height:100%;object-fit:contain;display:block}#state{height:30px}canvas{display:none}</style>
<div id="state">Starting explicit probe session</div><div id="surface"><video autoplay muted playsinline></video><img hidden></div><canvas width="576" height="40"></canvas>
<script>
const query=new URLSearchParams(location.search),token=query.get('token'),mode=query.get('mode'),origin=+query.get('origin');
const video=document.querySelector('video'),img=document.querySelector('img'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
const now=()=>performance.timeOrigin+performance.now()-origin;
window.probe={frames:[],inputs:[],acks:[],errors:[],metadata:[],stats:[],ready:false};
const mappings=new Map();let displayed=null,lastRtp=null,next=0,pending=[],inflight=0,epoch=0;
const socket=new WebSocket(`ws://${location.host}/input?token=${token}`);
function pump(){while(inflight<8&&pending.length){socket.send(JSON.stringify(pending.shift()));inflight++}}
socket.onmessage=e=>{const x=JSON.parse(e.data);if(x.kind==='media'){mappings.set(x.rtp_timestamp,x);probe.metadata.push(x);if(lastRtp===x.rtp_timestamp)displayed=x.state;return}if(x.operation==='acquire'){epoch=x.control_epoch;probe.ready=true}else{inflight--;probe.acks.push({...x,t:now()});pump()}state.textContent=`${mode} connected; epoch ${epoch}; ${probe.frames.length} presented`};
function sample(source,metadata){const scale=(source.videoWidth||source.naturalWidth)/+query.get('width');ctx.drawImage(source,0,0,576*scale,40*scale,0,0,576,40);const data=ctx.getImageData(0,0,576,40).data;let words=[];for(let row=0;row<4;row++){let word=0;for(let bit=0;bit<32;bit++)if(data[((row*10+5)*576+bit*18+9)*4]>128)word+=(2**bit);words.push(word)}const callbackAt=now();probe.frames.push({t:callbackAt+Math.max(0,(metadata.expectedDisplayTime||0)-(metadata.callbackTime||0)),callback_t:callbackAt,presentation_adjusted:true,words,...metadata});}
function presented(t,m){lastRtp=m.rtpTimestamp;displayed=mappings.get(lastRtp)?.state||null;sample(video,{rtp:m.rtpTimestamp,mediaTime:m.mediaTime,presentedFrames:m.presentedFrames,expectedDisplayTime:m.expectedDisplayTime,callbackTime:t,processingDuration:m.processingDuration});video.requestVideoFrameCallback(presented)}
function input(e){if(!probe.ready||!displayed)return;const rect=surface.getBoundingClientRect(),w=displayed.viewport_width,h=displayed.viewport_height,scale=Math.min(rect.width/w,rect.height/h),left=rect.x+(rect.width-w*scale)/2,top=rect.y+(rect.height-h*scale)/2,x=(e.clientX-left)/scale,y=(e.clientY-top)/scale;if(x<0||y<0||x>=w||y>=h)return;const id=++next,operation=e.type==='wheel'?'wheel':'pointer',phase={pointerdown:'down',pointermove:'move',pointerup:'up'}[e.type];if(operation==='pointer'&&phase==='move'&&!e.buttons){next--;return}e.preventDefault();if(phase==='down')surface.setPointerCapture(e.pointerId);const body={operation,phase,input_id:id,control_epoch:epoch,x,y,button:'left',delta_x:e.deltaX||0,delta_y:e.deltaY||0,target:displayed};probe.inputs.push({id,t:now(),operation,phase,x,y});pending.push(body);pump()}
for(const type of ['pointerdown','pointermove','pointerup','wheel'])surface.addEventListener(type,input,{passive:false});
window.stopProbe=async()=>{if(window.events)events.close();if(window.pc){probe.stats=Array.from((await pc.getStats()).values());await pc.close()}socket.close()};
window.ready=(async()=>{while(!probe.ready)await new Promise(r=>setTimeout(r,20));if(mode==='jpeg'){video.remove();img.hidden=false;window.events=new EventSource(`/stream?token=${token}`);events.onmessage=e=>{const frame=JSON.parse(e.data);if(frame.type==='frame'||frame.image){const image=new Image();image.onload=()=>{img.src=image.src;requestAnimationFrame(()=>requestAnimationFrame(()=>{if(img.src===image.src){sample(img,{sequence:frame.sequence});displayed=frame}}))};image.src=`data:image/jpeg;base64,${frame.image}`}}}else{img.remove();window.pc=new RTCPeerConnection({iceServers:[]});pc.addTransceiver('video',{direction:'recvonly'});pc.ontrack=e=>{video.srcObject=e.streams[0]||new MediaStream([e.track]);video.requestVideoFrameCallback(presented)};await pc.setLocalDescription(await pc.createOffer());await new Promise(r=>{if(pc.iceGatheringState==='complete')r();else pc.onicegatheringstatechange=()=>pc.iceGatheringState==='complete'&&r()});const response=await fetch(`/offer?token=${token}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pc.localDescription)});await pc.setRemoteDescription(await response.json())}})().catch(e=>probe.errors.push(String(e)));
</script>
