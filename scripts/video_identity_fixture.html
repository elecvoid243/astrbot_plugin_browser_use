<!doctype html><meta charset="utf-8"><title>Identity barrier fixture</title>
<style>body{margin:0;background:#f0f7ff;font:18px system-ui}canvas{position:fixed;left:0;top:0;z-index:5}h1{padding:115px 30px 0}#nested{margin:20px 40px;width:600px;height:300px;overflow:auto;border:4px solid #334155}#content{height:4000px;background:repeating-linear-gradient(#38bdf8 0px,#38bdf8 38px,#fff 38px,#fff 80px)}#long{height:4000px}button{position:fixed;left:850px;top:200px}</style>
<canvas id="stamp" width="576" height="90"></canvas><h1>Document __DOC__</h1><div id="nested"><div id="content">Nested scroller in document __DOC__</div></div><button id="button">Count clicks</button><div id="long"></div>
<script>
window.identityProbe={document:__DOC__,frames:0,clicks:0};
identityProbe.inputs=[];for(const type of ['pointerdown','pointerup'])addEventListener(type,e=>identityProbe.inputs.push({type,x:e.clientX,y:e.clientY,target:e.target.id}),true);
button.onclick=()=>identityProbe.clicks++;
const ctx=stamp.getContext('2d');
function draw(){const values=[0x41535452,identityProbe.document,innerWidth,innerHeight,Math.round(scrollY),Math.round(nested.scrollTop),window[Symbol.for('astrbot.browser.position')]?.revision||0,++identityProbe.frames,Math.round(performance.now())];for(let row=0;row<values.length;row++)for(let bit=0;bit<32;bit++){ctx.fillStyle=(values[row]>>>bit)&1?'#fff':'#000';ctx.fillRect(bit*18,row*10,18,10)}requestAnimationFrame(draw)}draw();
</script>
